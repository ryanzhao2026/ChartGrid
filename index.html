<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChartGrid · 期货图表 + 两极均线</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo">ChartGrid</span>
    <span class="sub">Futures · Two-Pole MA</span>
  </div>

  <div class="ctrl">
    <label>周期
      <select id="tf">
        <option value="D" selected>日线</option>
        <option value="W">周线</option>
        <option value="M">月线</option>
        <option value="Q">季线</option>
      </select>
    </label>

    <label>均线周期
      <input id="period" type="number" min="2" max="400" step="1" value="20">
    </label>

    <label>均线口径
      <select id="method">
        <option value="cascade">级联 EMA（两极）</option>
        <option value="smasma">SMA 的 SMA（两极）</option>
      </select>
    </label>

    <label>显示根数
      <input id="bars" type="number" min="20" max="500" step="10" value="130">
    </label>

    <div class="inds">
      <label class="chk"><input type="checkbox" id="ind-ma" checked>均线</label>
      <label class="chk"><input type="checkbox" id="ind-boll">BOLL</label>
      <label class="chk"><input type="checkbox" id="ind-macd">MACD</label>
      <label class="chk"><input type="checkbox" id="ind-rsi">RSI</label>
      <label class="chk"><input type="checkbox" id="ind-td" title="DeMark TD Setup 9（close vs close[4] 连续计数达 9）">TD9</label>
    </div>

    <button id="apply">应用</button>
  </div>
</header>

<nav id="tabs" class="tabs"></nav>

<main id="grid" class="grid"></main>

<footer class="foot">
  <span id="foot-info">加载中…</span>
  <span class="note">
    数据：yfinance 连续合约日线 · 仅供参考，不构成投资建议
  </span>
</footer>

<script src="app.js"></script>
</body>
</html>
