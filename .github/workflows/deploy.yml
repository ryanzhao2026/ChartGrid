name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    # 每天 22:10 UTC，约美股收盘后（21:00 UTC = 16:00 ET 冬令时）
    - cron: '10 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 数据提交与 Pages 部署串行，避免两个 run 同时 push data/ 造成 rebase 冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch futures data
        run: python fetch_data.py --days 500

      # 放行前先确认数据文件是合法 JSON。冲突标记一旦被提交，
      # 线上页面会直接「加载 manifest 失败」白屏，所以这里必须硬失败。
      - name: Validate data files
        run: |
          set -euo pipefail
          fail=0
          if grep -rlE '^(<<<<<<<|>>>>>>>|=======)$' data/ ; then
            echo "::error::data/ 中存在 Git 冲突标记"
            fail=1
          fi
          for f in data/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error::JSON 解析失败：$f"; fail=1; }
          done
          exit $fail

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name  "chartgrid-bot"
          git config user.email "chartgrid-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "推送成功"
              exit 0
            fi
            echo "第 $i 次推送失败，5s 后重试"
            # 上一次失败的 rebase 可能留下半成品状态，必须先清干净再重试
            git rebase --abort || true
            sleep 5
          done
          echo "::error::数据提交连续 3 次失败，请检查 main 分支状态"
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
